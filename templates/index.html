<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Check Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-gradient: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.5);
            transition: all 0.3s ease;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #f8fafc;
            color: var(--text-main);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .report-section {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .report-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
        }

        .btn-copy {
            background-color: #fff;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-copy:hover {
            background-color: #f1f5f9;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
            vertical-align: middle;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #error-msg {
            color: #ef4444;
            background: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Tổng Hợp Lịch Phòng</h1>

    <div class="form-group">
        <label for="token">Token Xác Thực (Từ F12)</label>
        <input type="text" id="token" placeholder="Bearer eyJhbGc... hoặc session_id=...">
    </div>

    <div class="form-group">
        <label for="date">Chọn Ngày Báo Cáo</label>
        <input type="date" id="date">
    </div>

    <button id="btn-fetch" onclick="fetchData()">
        Lấy Dữ Liệu
        <div class="loader" id="loader"></div>
    </button>

    <div id="error-msg"></div>

    <div class="report-section" id="report-section">
        <div class="form-group">
            <label for="branch-select">Chọn Cơ Sở</label>
            <select id="branch-select" onchange="showReport()"></select>
        </div>
        
        <div class="report-header">
            <h3 style="margin:0; font-size: 16px; color: var(--text-main);">Kết quả:</h3>
            <button class="btn-copy" onclick="copyText()">Copy Báo Cáo</button>
        </div>
        
        <div class="report-box" id="report-box"></div>
    </div>
</div>

<script>
    let reportsData = {};

    // Khởi tạo
    window.onload = async () => {
        // Lấy token cũ từ LocalStorage
        const savedToken = localStorage.getItem('room_check_token');
        if(savedToken) {
            document.getElementById('token').value = savedToken;
        }

        // Thiết lập ngày mặc định
        const now = new Date();
        if(now.getHours() >= 20) {
            now.setDate(now.getDate() + 1); // Đặt ngày mai nếu > 20h
        }
        
        // Format YYYY-MM-DD
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;
    };

    async function fetchData() {
        const token = document.getElementById('token').value.trim();
        const date = document.getElementById('date').value;
        const btn = document.getElementById('btn-fetch');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');
        
        if(!token) {
            showError("Vui lòng nhập Token!");
            return;
        }

        // Lưu config vào LocalStorage
        localStorage.setItem('room_check_token', token);

        // UI state
        btn.disabled = true;
        loader.style.display = 'inline-block';
        errorMsg.style.display = 'none';
        document.getElementById('report-section').style.display = 'none';

        try {
            const res = await fetch('/api/fetch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({date: date, token: token})
            });
            
            const data = await res.json();
            
            if(res.ok && data.status === 'success') {
                reportsData = data.reports;
                const select = document.getElementById('branch-select');
                select.innerHTML = ''; // Clear old options
                
                if(data.branches.length === 0) {
                    showError("Không có dữ liệu phòng cho ngày này.");
                } else {
                    data.branches.forEach(branch => {
                        const option = document.createElement('option');
                        option.value = branch;
                        option.textContent = branch;
                        select.appendChild(option);
                    });
                    
                    document.getElementById('report-section').style.display = 'block';
                    showReport();
                }
            } else {
                showError(data.error || "Có lỗi xảy ra khi lấy dữ liệu");
            }
        } catch(e) {
            showError("Lỗi kết nối đến server: " + e.message);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }

    function showReport() {
        const branch = document.getElementById('branch-select').value;
        if(branch && reportsData[branch]) {
            document.getElementById('report-box').textContent = reportsData[branch];
        } else {
            document.getElementById('report-box').textContent = "Không có dữ liệu.";
        }
    }

    function copyText() {
        const text = document.getElementById('report-box').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const copyBtn = document.querySelector('.btn-copy');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Đã Copy!';
            copyBtn.style.backgroundColor = '#ecfdf5';
            copyBtn.style.borderColor = '#10b981';
            copyBtn.style.color = '#047857';
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.backgroundColor = '';
                copyBtn.style.borderColor = '';
                copyBtn.style.color = '';
            }, 2000);
        });
    }

    function showError(msg) {
        const err = document.getElementById('error-msg');
        err.textContent = msg;
        err.style.display = 'block';
    }
</script>
</body>
</html>
