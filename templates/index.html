<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Someli Room Check Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --someli-dark: #122921; /* Dark Forest Green */
            --someli-green: #1A3A32;
            --someli-light: #F4F7F6;
            --someli-gold: #D4AF37;
            --text-main: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            background: url('/static/ecycga74jnrmw0d04k4ta4y8zg_result_0.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: url('/static/44806a4fb4c15f6382a338fa439240b6-Picsart-AiImageEnhancer.jpg');
            background-size: cover;
            background-position: center;
            border-radius: var(--radius);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header-banner {
            width: 100%;
            height: 180px;
            background: transparent;
            position: relative;
        }
        
        .header-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .logo-text {
            color: var(--someli-dark);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0 0 5px 0;
            text-shadow: 0 0 10px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.8);
        }

        .sub-logo {
            color: var(--someli-dark);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255,255,255,1), 0 0 15px rgba(255,255,255,1);
        }

        .main-content {
            padding: 35px 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--someli-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255,255,255,1), 0 0 15px rgba(255,255,255,1);
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #f8fafc;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            outline: none;
            border-color: var(--someli-green);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(26, 58, 50, 0.15);
        }

        button {
            background-color: var(--someli-green);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(26, 58, 50, 0.15);
        }

        button:hover {
            background-color: var(--someli-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(26, 58, 50, 0.25);
        }
        
        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .report-section {
            display: none;
            margin-top: 35px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .report-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 150px;
            color: var(--someli-dark);
        }

        .btn-copy {
            background-color: #fff;
            color: var(--someli-green);
            border: 1px solid var(--someli-green);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            width: auto;
            margin-top: 0;
            border-radius: 6px;
        }

        .btn-copy:hover {
            background-color: var(--someli-green);
            color: #fff;
            box-shadow: none;
        }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
            vertical-align: middle;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #error-msg {
            color: #b91c1c;
            background: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-banner">
        <div class="header-overlay">
            <h1 class="logo-text">Someli</h1>
            <div class="sub-logo">PROPERTY MANAGEMENT</div>
        </div>
    </div>

    <div class="main-content">
        <div class="form-group">
            <label for="token">Token Hệ Thống</label>
            <input type="text" id="token" placeholder="Bearer eyJhbG... hoặc session_id=...">
        </div>

        <div class="form-group">
            <label for="date">Chọn Ngày Tra Cứu</label>
            <input type="date" id="date">
        </div>

        <button id="btn-fetch" onclick="fetchData()">
            TRÍCH XUẤT BÁO CÁO
            <div class="loader" id="loader"></div>
        </button>

        <div id="error-msg"></div>

        <div class="report-section" id="report-section">
            <div class="form-group">
                <label for="branch-select">Khu vực / Chi nhánh</label>
                <select id="branch-select" onchange="showReport()"></select>
            </div>
            
            <div class="report-header">
                <h3 style="margin:0; font-size: 15px; font-weight: 700; color: var(--someli-dark);">Chi tiết báo cáo:</h3>
                <button class="btn-copy" onclick="copyText()">Sao Chép</button>
            </div>
            
            <div class="report-box" id="report-box"></div>
        </div>
    </div>
</div>

<script>
    let reportsData = {};

    window.onload = async () => {
        const savedToken = localStorage.getItem('room_check_token');
        if(savedToken) {
            document.getElementById('token').value = savedToken;
        }

        const now = new Date();
        if(now.getHours() >= 20) {
            now.setDate(now.getDate() + 1);
        }
        
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;
    };

    async function fetchData() {
        const token = document.getElementById('token').value.trim();
        const date = document.getElementById('date').value;
        const btn = document.getElementById('btn-fetch');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');
        
        if(!token) {
            showError("Vui lòng nhập Token hệ thống!");
            return;
        }

        localStorage.setItem('room_check_token', token);

        btn.disabled = true;
        loader.style.display = 'inline-block';
        errorMsg.style.display = 'none';
        document.getElementById('report-section').style.display = 'none';

        try {
            const res = await fetch('/api/fetch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({date: date, token: token})
            });
            
            const data = await res.json();
            
            if(res.ok && data.status === 'success') {
                reportsData = data.reports;
                const select = document.getElementById('branch-select');
                select.innerHTML = ''; 
                
                if(data.branches.length === 0) {
                    showError("Không lấy được danh sách cơ sở.");
                } else {
                    data.branches.forEach(branch => {
                        const option = document.createElement('option');
                        option.value = branch;
                        option.textContent = branch;
                        select.appendChild(option);
                    });
                    
                    document.getElementById('report-section').style.display = 'block';
                    showReport();
                }
            } else {
                showError(data.error || "Có lỗi xảy ra khi lấy dữ liệu");
            }
        } catch(e) {
            showError("Lỗi kết nối đến server: " + e.message);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }

    function showReport() {
        const branch = document.getElementById('branch-select').value;
        if(branch && reportsData[branch]) {
            document.getElementById('report-box').textContent = reportsData[branch];
        } else {
            document.getElementById('report-box').textContent = "Không có dữ liệu.";
        }
    }

    function copyText() {
        const text = document.getElementById('report-box').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const copyBtn = document.querySelector('.btn-copy');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Đã Sao Chép!';
            copyBtn.style.backgroundColor = 'var(--someli-gold)';
            copyBtn.style.borderColor = 'var(--someli-gold)';
            copyBtn.style.color = '#fff';
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.backgroundColor = '';
                copyBtn.style.borderColor = '';
                copyBtn.style.color = '';
            }, 2000);
        });
    }

    function showError(msg) {
        const err = document.getElementById('error-msg');
        err.textContent = msg;
        err.style.display = 'block';
    }
</script>
</body>
</html>
